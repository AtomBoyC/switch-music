name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  IMAGE_NAME: switch-music

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t . -v

  docker:
    needs: test
    runs-on: ubuntu-latest
    env:
      # Publishing is skipped (build + smoke test only) until both repository secrets are set.
      PUBLISH: ${{ github.event_name != 'pull_request' && secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v5

      - name: Publishing status
        run: |
          if [ "$PUBLISH" = "true" ]; then
            echo "Publishing to Docker Hub as ${DOCKERHUB_USERNAME}/${IMAGE_NAME}" | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Pull request: build only, not publishing." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            msg="Image NOT published: repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are missing (Settings → Secrets and variables → Actions)."
            echo "::warning title=Docker Hub publish skipped::${msg}"
            echo "⚠️ ${msg}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Smoke-test the image
        run: |
          docker build -t switch-music:ci .
          mkdir -p ci-data
          docker run -d --name sm -p 127.0.0.1:8765:8765 -v "$PWD/ci-data:/data" switch-music:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/api/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/ | grep -q "Switch Music"
          curl -fsS http://127.0.0.1:8765/api/platforms/status > /dev/null
          # The app process (PID 1 after setpriv) must not run as root, and must own /data.
          docker exec sm sh -c 'grep "^Uid:" /proc/1/status' | tee /dev/stderr | grep -q "10001"
          sudo ls -lan ci-data
          [ "$(sudo stat -c %u ci-data)" = "10001" ]
          docker logs sm
          docker rm -f sm

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_USERNAME || 'local' }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build (amd64 + arm64) and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub description
        if: env.PUBLISH == 'true' && github.ref == 'refs/heads/main'
        continue-on-error: true  # needs a token with Read/Write/Delete scope
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          short-description: "Self-hosted playlist migration & dedupe: Spotify, YTM, NetEase, QQ, Kugou, Apple Music"
          readme-filepath: ./DOCKER.md
