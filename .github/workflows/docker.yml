name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  IMAGE_NAME: switch-music

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t . -v

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # push to ghcr.io with the built-in GITHUB_TOKEN
    env:
      # Docker Hub publishing is skipped until both repository secrets are set.
      PUBLISH_HUB: ${{ github.event_name != 'pull_request' && secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
      # GitHub Container Registry needs no extra secrets.
      PUBLISH_GHCR: ${{ github.event_name != 'pull_request' }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve image names
        id: names
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          images=""
          if [ "$PUBLISH_HUB" = "true" ]; then
            images="${DOCKERHUB_USERNAME}/${IMAGE_NAME}"
            echo "Publishing to Docker Hub: ${DOCKERHUB_USERNAME}/${IMAGE_NAME}" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ github.event_name }}" != "pull_request" ]; then
            msg="Docker Hub publish skipped: repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are missing."
            echo "::warning title=Docker Hub publish skipped::${msg}"
            echo "⚠️ ${msg}" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$PUBLISH_GHCR" = "true" ]; then
            images="${images}"$'\n'"ghcr.io/${owner}/${IMAGE_NAME}"
            echo "Publishing to GHCR: ghcr.io/${owner}/${IMAGE_NAME}" >> "$GITHUB_STEP_SUMMARY"
          fi
          [ -n "$(echo "$images" | tr -d '[:space:]')" ] || images="local/${IMAGE_NAME}"
          {
            echo "images<<EOF"
            echo "$images" | sed '/^$/d'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Smoke-test the image
        run: |
          docker build -t switch-music:ci .
          mkdir -p ci-data
          docker run -d --name sm -p 127.0.0.1:8765:8765 -v "$PWD/ci-data:/data" switch-music:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/api/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/ | grep -q "Switch Music"
          curl -fsS http://127.0.0.1:8765/api/platforms/status > /dev/null
          # The app process (PID 1 after setpriv) must not run as root, and must own /data.
          docker exec sm sh -c 'grep "^Uid:" /proc/1/status' | tee /dev/stderr | grep -q "10001"
          sudo ls -lan ci-data
          [ "$(sudo stat -c %u ci-data)" = "10001" ]
          docker logs sm
          docker rm -f sm

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.PUBLISH_HUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH_GHCR == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.images }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build (amd64 + arm64) and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH_HUB == 'true' || env.PUBLISH_GHCR == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub description
        if: env.PUBLISH_HUB == 'true' && github.ref == 'refs/heads/main'
        continue-on-error: true  # needs a token with Read/Write/Delete scope
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          short-description: "Self-hosted playlist migration & dedupe: Spotify, YTM, NetEase, QQ, Kugou, Apple Music"
          readme-filepath: ./DOCKER.md

  release:
    # Tag push (e.g. `git tag v2.3.0 && git push origin v2.3.0`) -> GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Prepare release notes and assets
        run: |
          tag="${GITHUB_REF_NAME}"
          ver="${tag#v}"
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          hub="${{ secrets.DOCKERHUB_USERNAME }}"
          notes=".github/release-notes/${tag}.md"
          {
            if [ -f "$notes" ]; then cat "$notes"; echo; fi
            echo "## 🐳 Docker"
            echo
            echo '```bash'
            [ -n "$hub" ] && echo "docker pull ${hub}/${IMAGE_NAME}:${ver}"
            echo "docker pull ghcr.io/${owner}/${IMAGE_NAME}:${ver}"
            echo '```'
            echo
            echo "也可下载下方的 \`docker-compose.yml\`，执行 \`docker compose up -d\` 后打开 http://127.0.0.1:8765 。"
            echo
          } > release-body.md
          # Pin the compose file to this exact version.
          mkdir -p dist
          sed "s#:latest#:${ver}#" docker-compose.yml > dist/docker-compose.yml
          cat release-body.md

      - uses: softprops/action-gh-release@v2
        with:
          name: Switch Music ${{ github.ref_name }}
          body_path: release-body.md
          generate_release_notes: true
          files: dist/docker-compose.yml
